<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            height: max-content;
            width: 300px;
            /* border: 2px solid red; */
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 50px;
            gap: 5px;
            padding: 10px;
            box-shadow: 0px 0px 5px inset gray;
            border-radius: 10px;
        }

        main input {
            grid-column: 1/5;
        }
    </style>
</head>

<body>
    <main>
        <input type="text" readonly id="display" placeholder="0000">

        <button onclick="AllClear()">AC</button>
        <button onclick="TextDelete()">C</button>
        <button onclick="showInput('%')">%</button>
        <button onclick="showInput('/')">/</button>
        <button onclick="showInput(9)">9</button>
        <button onclick="showInput(8)">8</button>
        <button onclick="showInput(7)">7</button>
        <button onclick="showInput('+')">+</button>
        <button onclick="showInput(6)">6</button>
        <button onclick="showInput(5)">5</button>
        <button onclick="showInput(4)">4</button>
        <button onclick="showInput('-')">-</button>
        <button onclick="showInput(3)">3</button>
        <button onclick="showInput(2)">2</button>
        <button onclick="showInput(1)">1</button>
        <button onclick="showInput('*')">*</button>
        <button onclick="showInput(0)">0</button>
        <button onclick="showInput('00')">00</button>
        <button onclick="showInput('.')">.</button>
        <button onclick="Result()">=</button>
    </main>

    <script>

        function showInput(val) {
            console.log(val)
            display.value += val
        }

        function AllClear() {
            display.value = ''
        }

        function TextDelete() {
            display.value = display.value.slice(0, -1)
        }

        function Result() {
            display.value = eval(display.value)
        }

    </script>
</body>

</html>
